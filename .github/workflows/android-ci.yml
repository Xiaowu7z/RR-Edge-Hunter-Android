name: CF 优选IP Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Fetch pinned libXray Android runtime
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/libxray-android-v26.7.28.zip"
          curl --fail --location --retry 3 \
            https://github.com/XTLS/libXray/releases/download/v26.7.28/libxray-android.zip \
            --output "$ARCHIVE"
          echo "28b7dc9d6cc8455fcca5cbd56e387003a7bfb558128651a64899dc3a8ccff666  $ARCHIVE" | sha256sum --check --strict
          mkdir -p app/libs
          unzip -p "$ARCHIVE" libxray-android/libXray.aar > app/libs/libXray.aar
          test -s app/libs/libXray.aar

      - name: Run deterministic tests, lint, and debug build
        run: ./gradlew --no-daemon :logic-tests:check :app:lintDebug :app:assembleDebug

      - name: Verify Obtainium one-tap link
        run: python3 tools/verify_obtainium_link.py

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CF-IP-Optimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
