name: CF 优选IP Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Verify supplied reference App engine
        shell: bash
        run: |
          set -euo pipefail
          echo "fbfea92ee11be855b5f8bbfe66bd37c5134a7472d19c0ab6699a82672df46c6a  app/src/main/jniLibs/arm64-v8a/libgojni.so" |
            sha256sum --check --strict
          test ! -e app/libs/libXray.aar
          python3 tools/verify_reference_contract.py

      - name: Run deterministic tests, lint, and debug build
        run: ./gradlew --no-daemon :logic-tests:check :app:lintDebug :app:assembleDebug

      - name: Verify debug APK contains only the supplied native engine
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" lib/arm64-v8a/libgojni.so |
            sha256sum |
            grep -Fq "fbfea92ee11be855b5f8bbfe66bd37c5134a7472d19c0ab6699a82672df46c6a"
          ! unzip -Z1 "$APK" | grep -Eiq 'xray|libv2ray'

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CF-IP-Optimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
