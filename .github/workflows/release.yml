name: CF 优选IP Android Stable Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-stable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter-Android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release

    steps:
      - name: Checkout latest source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Verify supplied reference App engine
        shell: bash
        run: |
          set -euo pipefail
          echo "fbfea92ee11be855b5f8bbfe66bd37c5134a7472d19c0ab6699a82672df46c6a  app/src/main/jniLibs/arm64-v8a/libgojni.so" |
            sha256sum --check --strict
          test ! -e app/libs/libXray.aar
          python3 tools/verify_reference_contract.py

      - name: Validate fixed application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test "$VERSION_NAME" = "1.0.0"
          test "$VERSION_CODE" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'version=%s\n' "$VERSION_NAME" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CFIP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"
          test -s "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"

      - name: Test, lint, and build signed APK
        shell: bash
        env:
          CFIP_RELEASE_STORE_FILE: ${{ runner.temp }}/cf-ip-optimizer-release.p12
          CFIP_RELEASE_KEY_ALIAS: ${{ secrets.CFIP_ANDROID_KEY_ALIAS }}
          CFIP_RELEASE_STORE_PASSWORD: ${{ secrets.CFIP_ANDROID_STORE_PASSWORD }}
          CFIP_RELEASE_KEY_PASSWORD: ${{ secrets.CFIP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :logic-tests:check :app:lintRelease :app:assembleRelease

      - name: Verify APK identity and release signature
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ secrets.CFIP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.xiaowu7z.cfipoptimizer' versionCode='$VERSION_CODE' versionName='$VERSION'" <<<"$BADGING"
          grep -Fq "native-code: 'arm64-v8a'" <<<"$BADGING"
          VERIFY="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$VERIFY"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_DIGEST="$(sed -nE 's/^(Signer #1|V3\.0 Signer:) certificate SHA-256 digest: //p' <<<"$VERIFY" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED_CERT_DIGEST="$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')"
          [[ "$EXPECTED_CERT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$CERT_DIGEST" = "$EXPECTED_CERT_DIGEST"
          unzip -p "$APK" lib/arm64-v8a/libgojni.so |
            sha256sum |
            grep -Fq "fbfea92ee11be855b5f8bbfe66bd37c5134a7472d19c0ab6699a82672df46c6a"
          ! unzip -Z1 "$APK" | grep -Eiq 'xray|libv2ray'

      - name: Prepare the only Android release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0644 app/build/outputs/apk/release/app-release.apk dist/CF-IP-Optimizer.apk
          (cd dist && sha256sum CF-IP-Optimizer.apk > CF-IP-Optimizer.apk.sha256)

      - name: Replace old releases with the latest signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES_FILE="${RUNNER_TEMP}/stable-release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "CF 优选IP Android 正式版 $VERSION" \
            "构建提交：\`$GITHUB_SHA\`" \
            "测速完整调用所提供参考 App 的原版 Go 引擎；无需节点链接。每轮返回 1 个 IP，Cloudflare A/AAAA 解析只能由用户从结果页手动确认。" \
            > "$NOTES_FILE"

          while IFS= read -r OLD_TAG; do
            test -z "$OLD_TAG" || gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" "$GITHUB_SHA" -m "CF 优选IP Android $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            dist/CF-IP-Optimizer.apk \
            dist/CF-IP-Optimizer.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CF 优选IP Android $VERSION" \
            --notes-file "$NOTES_FILE" \
            --latest

          if git ls-remote --exit-code --tags origin refs/tags/testing >/dev/null 2>&1; then
            git push origin :refs/tags/testing
          fi
