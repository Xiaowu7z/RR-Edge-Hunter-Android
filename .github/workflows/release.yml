name: CF 优选IP Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter-Android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Validate release metadata
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION_CODE" -ge 1
          TAG_NAME="v$VERSION_NAME"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "发布标签 $TAG_NAME 已存在；请先提高 versionName 与 versionCode。" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在；禁止覆盖旧版资产。" >&2
            exit 1
          fi
          MAX_RELEASE_CODE=0
          while IFS= read -r PREVIOUS_TAG; do
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" 2>/dev/null | sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' | head -n 1 || true)"
            if [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && [ "$PREVIOUS_CODE" -gt "$MAX_RELEASE_CODE" ]; then
              MAX_RELEASE_CODE="$PREVIOUS_CODE"
            fi
          done < <(git tag -l 'v*.*.*')
          test "$VERSION_CODE" -gt "$MAX_RELEASE_CODE"
          printf 'version=%s\n' "$VERSION_NAME" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$VERSION_CODE" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CFIP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"
          test -s "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"

      - name: Test, lint, and build signed APK
        shell: bash
        env:
          CFIP_RELEASE_STORE_FILE: ${{ runner.temp }}/cf-ip-optimizer-release.p12
          CFIP_RELEASE_KEY_ALIAS: ${{ secrets.CFIP_ANDROID_KEY_ALIAS }}
          CFIP_RELEASE_STORE_PASSWORD: ${{ secrets.CFIP_ANDROID_STORE_PASSWORD }}
          CFIP_RELEASE_KEY_PASSWORD: ${{ secrets.CFIP_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :logic-tests:check :app:lintRelease :app:assembleRelease

      - name: Verify APK identity and signature
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ secrets.CFIP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.xiaowu7z.cfipoptimizer' versionCode='$VERSION_CODE' versionName='$VERSION'" <<<"$BADGING"
          VERIFY="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$VERIFY"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_DIGEST="$(sed -nE 's/^(Signer #1|V3\.0 Signer:) certificate SHA-256 digest: //p' <<<"$VERIFY" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED_CERT_DIGEST="$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')"
          [[ "$EXPECTED_CERT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$CERT_DIGEST" = "$EXPECTED_CERT_DIGEST"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ASSET_NAME="CF-IP-Optimizer.apk"
          install -m 0644 app/build/outputs/apk/release/app-release.apk "dist/$ASSET_NAME"
          (cd dist && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")
          printf 'apk=%s\n' "dist/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "dist/$ASSET_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Create tag and immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.assets.outputs.apk }}
          SHA_PATH: ${{ steps.assets.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "发布标签 $TAG 已存在；禁止覆盖旧版资产。" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在；禁止覆盖旧版资产。" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "CF 优选IP $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$APK_PATH" "$SHA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CF 优选IP $VERSION" \
            --generate-notes \
            --latest
