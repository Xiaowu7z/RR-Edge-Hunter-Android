name: CF 优选IP Android Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-testing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  testing:
    if: github.repository == 'Xiaowu7z/RR-Edge-Hunter-Android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release

    steps:
      - name: Checkout testing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Validate fixed testing metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$VERSION_NAME" = "1.0.0"
          test "$VERSION_CODE" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'version=%s\n' "$VERSION_NAME" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CFIP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"
          test -s "${RUNNER_TEMP}/cf-ip-optimizer-release.p12"

      - name: Test, lint, and build signed testing APK
        shell: bash
        env:
          CFIP_RELEASE_STORE_FILE: ${{ runner.temp }}/cf-ip-optimizer-release.p12
          CFIP_RELEASE_KEY_ALIAS: ${{ secrets.CFIP_ANDROID_KEY_ALIAS }}
          CFIP_RELEASE_STORE_PASSWORD: ${{ secrets.CFIP_ANDROID_STORE_PASSWORD }}
          CFIP_RELEASE_KEY_PASSWORD: ${{ secrets.CFIP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :logic-tests:check :app:lintRelease :app:assembleRelease

      - name: Verify APK identity and signature
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ secrets.CFIP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"
          test -d "$BUILD_TOOLS"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.xiaowu7z.cfipoptimizer' versionCode='$VERSION_CODE' versionName='$VERSION'" <<<"$BADGING"
          VERIFY="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$VERIFY"
          test -n "$EXPECTED_CERT_SHA256"
          CERT_DIGEST="$(sed -nE 's/^(Signer #1|V3\.0 Signer:) certificate SHA-256 digest: //p' <<<"$VERIFY" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          EXPECTED_CERT_DIGEST="$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')"
          [[ "$EXPECTED_CERT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$CERT_DIGEST" = "$EXPECTED_CERT_DIGEST"

      - name: Prepare fixed testing assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ASSET_NAME="CF-IP-Optimizer-testing.apk"
          install -m 0644 app/build/outputs/apk/release/app-release.apk "dist/$ASSET_NAME"
          (cd dist && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")

      - name: Update isolated testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TESTING_TAG="testing"
          test "$TESTING_TAG" = "testing"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          NOTES_FILE="${RUNNER_TEMP}/testing-release-notes.md"
          printf '%s\n\n%s\n\n%s\n' \
            "Android 测试通道（应用版本仍为 $VERSION）" \
            "构建提交：\`$GITHUB_SHA\`" \
            "这是预发布测试包；同版本更新需要手动下载并覆盖安装。正式 latest 版本不受影响。" \
            > "$NOTES_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TESTING_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TESTING_TAG:refs/tags/$TESTING_TAG"

          if gh release view "$TESTING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TESTING_TAG" \
              dist/CF-IP-Optimizer-testing.apk \
              dist/CF-IP-Optimizer-testing.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TESTING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CF 优选IP Android 测试通道" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          else
            gh release create "$TESTING_TAG" \
              dist/CF-IP-Optimizer-testing.apk \
              dist/CF-IP-Optimizer-testing.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CF 优选IP Android 测试通道" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi
